<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer churn risk</title>
<style>
:root{--paper:#eef2f4;--field:#fff;--ink:#101820;--muted:#566570;--rule:#c5d0d6;--accent:#0b6e7a}
@media(prefers-color-scheme:dark){:root{--paper:#12181d;--field:#1a2229;--ink:#e8eef1;--muted:#93a3ad;--rule:#2b3640;--accent:#4cc3d1}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif}
main{max-width:1020px;margin:0 auto;padding:36px 20px 72px}
h1{font-size:2.1rem;line-height:1.1;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0 0 30px;color:var(--muted);max-width:56ch}
.layout{display:grid;gap:32px}
@media(min-width:880px){.layout{grid-template-columns:1fr 340px;align-items:start}}
fieldset{border:0;border-top:2px solid var(--ink);margin:0 0 26px;padding:10px 0 0}
legend{font-weight:600;padding:0 12px 0 0;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 16px}
label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 14px}
select,input{width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:4px}
select:disabled{opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{width:100%;padding:14px;font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:4px;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#08161a}}
button:disabled{opacity:.6;cursor:wait}
#result{position:sticky;top:20px;background:#0b1116;color:#e8eef1;border-radius:6px;padding:24px}
.state{margin:0 0 18px;font-size:1.5rem;font-weight:600;color:#9db0ba}
.state.hot{color:#ff6b4a}.state.ok{color:#5fd3b0}
.bars{display:flex;align-items:flex-end;gap:5px;height:84px;margin-bottom:18px}
.bars i{flex:1;background:#24303a;border-radius:2px}
.bars i.on{background:#7fa6b3}.bars i.on.hot{background:#ff6b4a}
.num{margin:0 0 10px;font-size:2.6rem;font-weight:600;line-height:1}
.num span{font-size:.95rem;font-weight:400;color:#9db0ba}
.note{margin:0;font-size:.88rem;color:#9db0ba}
</style>
</head>
<body>
<main>
  <h1>Customer churn risk</h1>
  <p class="sub">Enter a customer’s plan and billing details to see whether they are likely to leave.</p>
  <div class="layout">
    <form id="form"></form>
    <aside id="result" aria-live="polite"></aside>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const YN = ["No", "Yes"];
const ADD = ["No", "Yes", "No internet service"];
const addons = ["online_security", "online_backup", "device_protection", "tech_support", "streaming_tv", "streaming_movies"];

// [id, label, options (select) or "number", default, step]
const groups = [
  ["About the customer", [
    ["gender", "Gender", ["Male", "Female"]],
    ["senior_citizen", "Senior citizen", YN],
    ["partner", "Has a partner", YN],
    ["dependents", "Has dependents", YN],
    ["latitude", "Latitude", "number", 34.05, "any"],
    ["longitude", "Longitude", "number", -118.24, "any"]]],
  ["Phone and internet", [
    ["phone_service", "Phone service", ["Yes", "No"]],
    ["multiple_lines", "Multiple lines", ["No", "Yes", "No phone service"]],
    ["internet_service", "Internet service", ["Fiber optic", "DSL", "No"]],
    ["online_security", "Online security", ADD],
    ["online_backup", "Online backup", ADD],
    ["device_protection", "Device protection", ADD],
    ["tech_support", "Tech support", ADD],
    ["streaming_tv", "Streaming TV", ADD],
    ["streaming_movies", "Streaming movies", ADD]]],
  ["Contract and billing", [
    ["contract", "Contract", ["Month-to-month", "One year", "Two year"]],
    ["paperless_billing", "Paperless billing", ["Yes", "No"]],
    ["payment_method", "Payment method", ["Electronic check", "Mailed check", "Bank transfer (automatic)", "Credit card (automatic)"]],
    ["tenure_months", "Tenure (months)", "number", 12, "1"],
    ["monthly_charges", "Monthly charges ($)", "number", 70, "0.01"],
    ["total_charges", "Total charges ($)", "number", 840, "0.01"]]]
];
const fields = groups.flatMap(g => g[1]);

$("form").innerHTML = groups.map(([title, fs]) =>
  `<fieldset><legend>${title}</legend><div class="grid">` +
  fs.map(([id, label, x, d, step]) => `<label>${label}` + (Array.isArray(x)
    ? `<select id="${id}">${x.map(o => `<option>${o}</option>`).join("")}</select>`
    : `<input id="${id}" type="number" value="${d}" step="${step}" min="${id === "latitude" || id === "longitude" ? "" : 0}" required>`) + `</label>`).join("") +
  `</div></fieldset>`).join("") + `<button id="go" type="submit">Predict risk</button>`;

// Keep related answers consistent: no phone / no internet lock the dependent fields
function lock(sel, on, special) {
  [...sel.options].forEach(o => { if (o.value === special) { o.hidden = !on; o.disabled = !on; } });
  if (on) sel.value = special; else if (sel.value === special) sel.value = "No";
  sel.disabled = on;
}
function sync() {
  lock($("multiple_lines"), $("phone_service").value === "No", "No phone service");
  addons.forEach(id => lock($(id), $("internet_service").value === "No", "No internet service"));
}
$("phone_service").addEventListener("change", sync);
$("internet_service").addEventListener("change", sync);
sync();

function render(d) {
  const s = d ? d.churn_risk_score : 0, t = d ? d.threshold : 0, high = d && d.churn_prediction === 1;
  $("result").innerHTML =
    `<p class="state ${d ? (high ? "hot" : "ok") : ""}">${d ? (high ? "High risk" : "Low risk") : "No result yet"}</p>` +
    `<div class="bars" role="img" aria-label="Risk score ${s.toFixed(2)}">` +
    Array.from({ length: 10 }, (_, i) =>
      `<i class="${d && s > i / 10 ? "on" : ""} ${d && (i + 1) / 10 > t ? "hot" : ""}" style="height:${28 + i * 8}%"></i>`).join("") + `</div>` +
    (d ? `<p class="num">${s.toFixed(2)}<span> risk score</span></p>
          <p class="note">Customers scoring ${t.toFixed(2)} or higher are flagged as likely to leave. The score ranks customers by risk. It is not an exact chance of leaving.</p>`
       : `<p class="note">Fill in the customer details and press Predict risk.</p>`);
}
function fail(msg) {
  $("result").innerHTML = `<p class="state hot">Could not predict</p><p class="note" id="msg"></p>`;
  $("msg").textContent = msg;
}
render(null);

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const body = {};
  fields.forEach(([id, , x]) => { const v = $(id).value; body[id] = Array.isArray(x) ? v : Number(v); });
  body.tenure_months = Math.round(body.tenure_months);
  const btn = $("go");
  btn.disabled = true; btn.textContent = "Predicting…";
  try {
    const r = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(Array.isArray(data.detail)
      ? data.detail.map(d => `${d.loc.slice(1).join(".")}: ${d.msg}`).join("; ")
      : (data.detail || "The server rejected the request."));
    render(data);
  } catch (err) {
    fail(err.message || "The server could not be reached. Check that it is running.");
  } finally {
    btn.disabled = false; btn.textContent = "Predict risk";
  }
});
</script>
</body>
</html>
