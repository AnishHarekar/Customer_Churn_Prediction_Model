name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t churn-api .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name churn churn-api
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break || sleep 1; done
          curl -fs http://localhost:8000/health